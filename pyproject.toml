[project]
name = "f1-strategy-predictor"
version = "0.1.0"
description = "F1 Strategy Predictor"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.110.0",
    "fastf1>=3.0.2",
    "matplotlib>=3.8.0",
    "numpy==1.26.4",
    "pandas<3",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "tensorflow==2.15.1",
    "requests>=2.31.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
